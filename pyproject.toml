[project]
name = "audience-metrics"
version = "0.1.0"
description = "Classroom lab for a reproducible Python quality toolchain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
audience-metrics = "audience_metrics.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-select = ["B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
