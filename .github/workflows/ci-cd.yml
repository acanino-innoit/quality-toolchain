name: CI and Delivery Demo

on:
  push:
    branches:
      - feat/githubaction

permissions:
  contents: read

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Reproduce project environment
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest

  delivery:
    name: Build delivery artifact
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: audience-metrics-package
          path: dist/
